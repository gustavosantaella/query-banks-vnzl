# ============================================================================
#  Docker para el ENTORNO (navegador) sin empaquetar la aplicación.
#
#  Servicios:
#    backend   -> construye SOLO la etapa 'browser' del Dockerfile (imagen base con
#                 Chromium) y monta el código del backend por volumen.
#                 La imagen NO contiene la app: el código entra al ejecutar.
#    selenium  -> (opcional, perfil "remote") navegador en su propio contenedor;
#                 úsalo con SELENIUM_REMOTE_URL=http://localhost:4444
#
#  Uso:
#    docker compose up -d                    # app + navegador local (base + código montado)
#    docker compose --profile remote up -d   # además, navegador en contenedor aparte
#    docker compose logs -f backend
#    docker compose down
# ============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: browser          # <-- solo el entorno del navegador, sin la app
    container_name: querybank-backend
    working_dir: /app
    # El código vive en tu disco, no en la imagen
    volumes:
      - ./backend/src:/app/src
      - ./backend/main.py:/app/main.py
      - ./backend/requirements.txt:/app/requirements.txt
    env_file:
      - ./backend/.env
    environment:
      # La imagen base NO incluye servidor gráfico (Xvfb), por eso aquí va headless.
      # Para VER el navegador usa el perfil "remote" (contenedor Selenium con Xvfb + VNC).
      - SELENIUM_HEADLESS=True
    ports:
      - "8000:8000"
    # Instala las dependencias de Python y arranca (con recarga automática)
    command: sh -c "python -m pip install --quiet -r /app/requirements.txt && python -m uvicorn src.app_module:http_server --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  # Navegador en un contenedor aparte (solo la imagen oficial de Selenium).
  # Actívalo con:  docker compose --profile remote up -d
  # y en backend/.env:  SELENIUM_REMOTE_URL=http://localhost:4444
  selenium:
    image: selenium/standalone-chromium:latest
    container_name: querybank-selenium
    profiles: ["remote"]
    shm_size: 2gb
    ports:
      - "4444:4444"   # Selenium Grid (WebDriver remoto)
      - "7900:7900"   # VNC/visor -> http://localhost:7900 (contraseña: secret)
    environment:
      - SE_START_XVFB=true
      - SE_NODE_SESSION_TIMEOUT=900
      - SE_NODE_MAX_SESSIONS=4
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
    restart: unless-stopped

